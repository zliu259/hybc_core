services:
  n8n:
    image: n8nio/n8n:1.77.0
    container_name: hybc-n8n
    env_file:
      - .env.example
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Shanghai}
      - API_BASE_URL=${API_BASE_URL:-http://host.docker.internal:8787}
      - N8N_API_TOKEN=${N8N_API_TOKEN:-}
    volumes:
      - ./data:/home/node/.n8n
      - ./workflows:/workflows
