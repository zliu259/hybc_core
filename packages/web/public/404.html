<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f7f8fa;
        color: #303133;
      }

      .card {
        padding: 28px 32px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 6px 24px rgb(0 0 0 / 8%);
        text-align: center;
      }

      .title {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }

      .desc {
        margin: 10px 0 0;
        font-size: 14px;
        color: #606266;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="title">404 Not Found</h1>
      <p class="desc">请求的资源不存在，请返回首页重试。</p>
    </div>
  </body>
</html>
