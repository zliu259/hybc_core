name = "hybc-api"
main = "src/index.ts"
compatibility_date = "2026-02-11"
account_id = "78939a17148c390144ef58e10a619393"

[[d1_databases]]
binding = "DB"
database_name = "hybcdg-prod-db"
database_id = "6dfb0cfc-bcb5-4800-ad86-48435b77a315"
migrations_dir = "migrations"

[[d1_databases]]
binding = "LEGACY_DB"
database_name = "hybcdg-prod-legacy-db"
database_id = "e2aae206-f20e-4029-b5dc-32fa14aa22f4"

[[r2_buckets]]
binding = "FILES"
bucket_name = "hybcdg-prod-files"
preview_bucket_name = "hybcdg-prod-files"

[[kv_namespaces]]
binding = "KV"
id = "26185146a68f4571b8ce2003522d779f"
preview_id = "d9ab79e68aa947f8b9f82718350b5962"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "hybcdg-prod-events"

[vars]
# 不变式:本文件绑定的是**生产**资源(hybcdg-prod-db / -legacy-db / -files / -events
# 与生产 KV),因此 APP_ENV 绝不能是 "local"。
# APP_ENV 不只是展示字段,它是安全闸门:
#  - routes/auth.ts 的 POST /api/v1/auth/login/web 在 APP_ENV === "local" 时,
#    接受不带 WeCom code 的裸 {"username":"..."} 并直接签发真实会话 —— 即零凭证登录;
#  - services/passkey.ts 在 KV 无配置时以 APP_ENV === "local" 决定 passkey 默认开关。
# 「生产绑定 + APP_ENV=local」= 生产免认证登录。本项目已因 APP_ENV 误配发生过一次
# 生产鉴权旁路事故,这是同一失效模式的重复,不是假想风险。
# 本地开发请用 `wrangler dev` 走 wrangler.toml + .dev.vars(其中 APP_ENV=local),
# 不要把本文件改成 local。回归守卫见 test/wrangler-prod-env.test.ts。
APP_ENV = "production"
# 【密钥不写在这里】JWT_SECRET / UPLOAD_SIGNING_SECRET / TASK_API_KEY /
# WECHAT_SECRET / WECHAT_BRIDGE_TOKEN(以及 AGENT_REPLAY_SECRET)一律只经
# `wrangler secret put <NAME> --env prod` 下发,绝不可再作为明文 var 写回:
# 同名的明文 var 与 secret 在 Workers 里不能共存(API 10053),部署要么失败、
# 要么把已配置好的 secret 覆盖回明文;且本文件受版本控制,写进来的值在 git
# 历史里永久暴露。本地开发的唯一来源是 .dev.vars(已 gitignore)。
BRIDGE_HEALTH_URL = "https://bridge.hybcdg.com/health"
RUNNER_HEALTH_URL = "https://runner.hybcdg.com/health"
WECHAT_CORPID = "ww3ddef5ccb9428432"
WECHAT_AGENT_ID = "1000014"
WECHAT_BRIDGE_BASE_URL = "https://bridge.hybcdg.com"
WECHAT_BRIDGE_PROXY_URL = "https://bridge.hybcdg.com/wecom/proxy"
WECHAT_REDIRECT_URI = "https://web.hybcdg.com/login"
WECOM_MINIAPP_APPID = "wx25b3b1ad9febbec7"
WECOM_APPROVAL_MINI_PAGE_PATH = "pages/approval-detail/index?id={id}"
WECOM_APPROVAL_DEFAULT_TARGET = "miniapp"
PASSKEY_RP_ID = "web.hybcdg.com"
PASSKEY_RP_NAME = "HYBC"

workers_dev = false
routes = [
  { pattern = "api.hybcdg.com/*", zone_name = "hybcdg.com" }
]

[triggers]
crons = ["*/2 * * * *", "0 * * * *", "0 18 * * *"]
