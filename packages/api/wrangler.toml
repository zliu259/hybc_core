WEB_ENTRY_HEALTH_URL = "https://web.hybcdg.com/platform-config.json"
WECHAT_CORPID = "ww3ddef5ccb9428432"
WECHAT_AGENT_ID = "1000014"
WECHAT_BRIDGE_BASE_URL = "https://bridge.hybcdg.com"
WECHAT_BRIDGE_PROXY_URL = "https://bridge.hybcdg.com/wecom/proxy"
WECHAT_REDIRECT_URI = "https://web.hybcdg.com/login"
WECOM_MINIAPP_APPID = "wx25b3b1ad9febbec7"
WECOM_APPROVAL_MINI_PAGE_PATH = "pages/approval-detail/index?id={id}"
WECOM_APPROVAL_DEFAULT_TARGET = "miniapp"
WECOM_TOOL_WEB_BASE_URL = "https://web.hybcdg.com"
WECOM_PUSH_API_BASE_URL = "https://api.hybcdg.com"
WECOM_DEFAULT_PROJECT_PUSH_WEBHOOK_SECRET_REF = "project-144-test"
PASSKEY_RP_ID = "web.hybcdg.com"
PASSKEY_RP_NAME = "HYBC"
REIMBURSEMENT_REQUIRE_PAYEE = "false"
AGENT_WEB_BASE_URL = "https://web.hybcdg.com"
AGENT_API_BASE_URL = "https://api.hybcdg.com"

[env.prod.ai]
binding = "AI"

[env.prod.triggers]
crons = ["*/2 * * * *", "0 * * * *", "0 18 * * *"]
