name = "hybc-api"
main = "src/index.ts"
compatibility_date = "2026-02-11"
account_id = "78939a17148c390144ef58e10a619393"

[[d1_databases]]
binding = "DB"
database_name = "hybcdg-prod-db"
database_id = "6dfb0cfc-bcb5-4800-ad86-48435b77a315"
migrations_dir = "migrations"

[[d1_databases]]
binding = "LEGACY_DB"
database_name = "hybcdg-prod-legacy-db"
database_id = "e2aae206-f20e-4029-b5dc-32fa14aa22f4"

[[r2_buckets]]
binding = "FILES"
bucket_name = "hybcdg-prod-files"
preview_bucket_name = "hybcdg-prod-files"

[[kv_namespaces]]
binding = "KV"
id = "26185146a68f4571b8ce2003522d779f"
preview_id = "d9ab79e68aa947f8b9f82718350b5962"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "hybcdg-prod-events"

[[queues.consumers]]
queue = "hybcdg-prod-events"
max_batch_size = 10
max_retries = 3

# 注意:CF Workers Builds 自动部署 hybc-api-prod 实际采用本顶层 [vars]
# (2026-07-16 实测),所以这里必须是 "production"。
# 本地 wrangler dev 请用 .dev.vars 覆盖 APP_ENV=local(cp .dev.vars.example .dev.vars)。
[vars]
APP_ENV = "production"
# 【密钥不写在这里】JWT_SECRET / UPLOAD_SIGNING_SECRET / TASK_API_KEY /
# WECHAT_SECRET / WECHAT_BRIDGE_TOKEN(以及 AGENT_REPLAY_SECRET)一律只经
# `wrangler secret put <NAME> --env prod` 下发,绝不可再作为明文 var 写回:
#  - Workers 里同名的明文 var 与 secret 不能共存(API 10053),部署要么直接失败,
#    要么把已配置好的 secret 覆盖回明文值;
#  - 本文件受版本控制,写进来的值在 git 历史里永久暴露,删除也追不回。
# 本地开发的唯一来源是 .dev.vars(已 gitignore,见 .dev.vars.example)。
# 回归守卫见 test/wrangler-prod-env.test.ts。
BRIDGE_HEALTH_URL = "https://bridge.hybcdg.com/health"
RUNNER_HEALTH_URL = "https://runner.hybcdg.com/health"
RELAY_STATUS_URLS = "https://bridge.hybcdg.com/relay/status"
API_RELAY_HEALTH_URL = "https://api-relay.hybcdg.com/api/v1/system/health"
WEB_ENTRY_HEALTH_URL = "https://web.hybcdg.com/platform-config.json"
WECHAT_CORPID = "ww3ddef5ccb9428432"
WECHAT_AGENT_ID = "1000014"
WECHAT_BRIDGE_BASE_URL = "https://bridge.hybcdg.com"
WECHAT_BRIDGE_PROXY_URL = "https://bridge.hybcdg.com/wecom/proxy"
WECHAT_REDIRECT_URI = "https://web.hybcdg.com/login"
WECOM_MINIAPP_APPID = "wx25b3b1ad9febbec7"
WECOM_APPROVAL_MINI_PAGE_PATH = "pages/approval-detail/index?id={id}"
WECOM_APPROVAL_DEFAULT_TARGET = "miniapp"
WECOM_TOOL_WEB_BASE_URL = "https://web.hybcdg.com"
WECOM_PUSH_API_BASE_URL = "https://api.hybcdg.com"
WECOM_DEFAULT_PROJECT_PUSH_WEBHOOK_SECRET_REF = "project-144-test"
PASSKEY_RP_ID = "web.hybcdg.com"
PASSKEY_RP_NAME = "HYBC"
REIMBURSEMENT_REQUIRE_PAYEE = "false"
AGENT_WEB_BASE_URL = "https://web.hybcdg.com"
AGENT_API_BASE_URL = "https://api.hybcdg.com"

# Workers AI / AI Gateway 统一模型入口（第三方模型经 Unified Billing 计费，
# 需 owner 在 CF dashboard 预充 credits）。顶层与 env.prod 两段必须同步。
[ai]
binding = "AI"

[triggers]
crons = ["*/2 * * * *", "0 * * * *", "0 18 * * *"]

[env.prod]
workers_dev = false
routes = [
  { pattern = "api.hybcdg.com/*", zone_name = "hybcdg.com" }
]

[[env.prod.d1_databases]]
binding = "DB"
database_name = "hybcdg-prod-db"
database_id = "6dfb0cfc-bcb5-4800-ad86-48435b77a315"
migrations_dir = "migrations"

[[env.prod.d1_databases]]
binding = "LEGACY_DB"
database_name = "hybcdg-prod-legacy-db"
database_id = "e2aae206-f20e-4029-b5dc-32fa14aa22f4"

[[env.prod.r2_buckets]]
binding = "FILES"
bucket_name = "hybcdg-prod-files"
preview_bucket_name = "hybcdg-prod-files"

[[env.prod.kv_namespaces]]
binding = "KV"
id = "26185146a68f4571b8ce2003522d779f"
preview_id = "d9ab79e68aa947f8b9f82718350b5962"

[[env.prod.queues.producers]]
binding = "EVENT_QUEUE"
queue = "hybcdg-prod-events"

[[env.prod.queues.consumers]]
queue = "hybcdg-prod-events"
max_batch_size = 10
max_retries = 3

[env.prod.vars]
APP_ENV = "production"
# 【密钥不写在这里】同上:JWT_SECRET / UPLOAD_SIGNING_SECRET / TASK_API_KEY /
# WECHAT_SECRET / WECHAT_BRIDGE_TOKEN(以及 AGENT_REPLAY_SECRET)只经
# `wrangler secret put <NAME> --env prod` 下发。明文 var 与同名 secret 相撞(10053),
# 且一旦提交就在 git 历史里永久暴露 —— 两个 vars 段落都必须保持干净。
BRIDGE_HEALTH_URL = "https://bridge.hybcdg.com/health"
RUNNER_HEALTH_URL = "https://runner.hybcdg.com/health"
RELAY_STATUS_URLS = "https://bridge.hybcdg.com/relay/status"
