name = "hybc-api"
main = "src/index.ts"
compatibility_date = "2026-02-11"
account_id = "78939a17148c390144ef58e10a619393"

[[d1_databases]]
binding = "DB"
database_name = "hybcdg-prod-db"
database_id = "6dfb0cfc-bcb5-4800-ad86-48435b77a315"
