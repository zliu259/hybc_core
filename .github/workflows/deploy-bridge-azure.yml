name: Deploy Azure Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "scripts/deploy/bridge-azure-vm.sh"
      - "scripts/deploy/bridge-azure-update.sh"
      - ".github/workflows/deploy-bridge-azure.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy bridge on Azure VM over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_BRIDGE_HOST }}
          username: ${{ secrets.AZURE_BRIDGE_USER }}
          key: ${{ secrets.AZURE_BRIDGE_SSH_KEY }}
          script: |
            export DEPLOY_ROOT=/opt/hybc_core
            export GIT_BRANCH=main
            export SERVICE_NAME=hybc-bridge
            export GIT_REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ -d "$DEPLOY_ROOT/.git" ]; then
              cd "$DEPLOY_ROOT"
              bash scripts/deploy/bridge-azure-update.sh
            else
              git clone --branch "$GIT_BRANCH" "$GIT_REPO_URL" "$DEPLOY_ROOT"
              cd "$DEPLOY_ROOT"
              GIT_REPO_URL="$GIT_REPO_URL" GIT_BRANCH="$GIT_BRANCH" bash scripts/deploy/bridge-azure-vm.sh
            fi
