name: Deploy Azure Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "scripts/deploy/bridge-azure-vm.sh"
      - "scripts/deploy/bridge-azure-update.sh"
      - ".github/workflows/deploy-bridge-azure.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload bridge bundle to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_BRIDGE_HOST }}
          username: ${{ secrets.AZURE_BRIDGE_USER }}
          key: ${{ secrets.AZURE_BRIDGE_SSH_KEY }}
          source: "bridge,scripts/deploy/bridge-azure-vm.sh,scripts/deploy/bridge-azure-update.sh"
          target: "~/hybc_core_ci"

      - name: Deploy bridge on Azure VM over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_BRIDGE_HOST }}
          username: ${{ secrets.AZURE_BRIDGE_USER }}
          key: ${{ secrets.AZURE_BRIDGE_SSH_KEY }}
          script: |
            export DEPLOY_ROOT=/opt/hybc_core
            export GIT_BRANCH=main
            export SERVICE_NAME=hybc-bridge

            sudo mkdir -p "$DEPLOY_ROOT"
            sudo chown -R "$USER":"$USER" "$DEPLOY_ROOT"
            mkdir -p "$DEPLOY_ROOT/scripts/deploy"

            SOURCE_BRIDGE_DIR="$(find "$HOME/hybc_core_ci" -type d -name bridge | head -n 1)"
            SOURCE_DEPLOY_DIR="$(find "$HOME/hybc_core_ci" -type d -path '*/scripts/deploy' | head -n 1)"
            if [ -z "$SOURCE_BRIDGE_DIR" ] || [ -z "$SOURCE_DEPLOY_DIR" ]; then
              echo "bridge bundle not found in uploaded files" >&2
              exit 1
            fi

            rm -rf "$DEPLOY_ROOT/bridge"
            mkdir -p "$DEPLOY_ROOT"
            cp -a "$SOURCE_BRIDGE_DIR" "$DEPLOY_ROOT/bridge"
            cp "$SOURCE_DEPLOY_DIR/bridge-azure-vm.sh" "$DEPLOY_ROOT/scripts/deploy/"
            cp "$SOURCE_DEPLOY_DIR/bridge-azure-update.sh" "$DEPLOY_ROOT/scripts/deploy/"
            chmod +x "$DEPLOY_ROOT/scripts/deploy/bridge-azure-vm.sh" "$DEPLOY_ROOT/scripts/deploy/bridge-azure-update.sh"

            export BRIDGE_PROXY_TOKEN="${{ secrets.AZURE_BRIDGE_PROXY_TOKEN }}"

            cd "$DEPLOY_ROOT"
            bash scripts/deploy/bridge-azure-update.sh

            sudo systemctl status hybc-bridge --no-pager
            curl -fsS --max-time 8 http://127.0.0.1:9001/health
            grep -n "@app.post(\"/wecom/proxy\")" "$DEPLOY_ROOT/bridge/app/main.py"
            curl -fsS --max-time 8 -X POST "http://127.0.0.1:9001/wecom/proxy" -H "Content-Type: application/json" -d '{"url":"https://qyapi.weixin.qq.com/cgi-bin/gettoken?corpid=test&corpsecret=test"}' >/tmp/bridge_proxy_check.json || true
            if grep -q 'Not Found' /tmp/bridge_proxy_check.json; then
              echo "bridge proxy route not active" >&2
              cat /tmp/bridge_proxy_check.json
              exit 1
            fi
            if command -v caddy >/dev/null 2>&1; then
              sudo systemctl status caddy --no-pager
            fi
