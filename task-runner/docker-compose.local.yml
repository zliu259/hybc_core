services:
  task-runner-primary:
    build: .
    container_name: hybc-task-runner-primary
    env_file:
      - ./env/node-primary.env
    volumes:
      - ./security/certs:/certs:ro
    restart: unless-stopped

  task-runner-secondary:
    build: .
    container_name: hybc-task-runner-secondary
    env_file:
      - ./env/node-secondary.env
    volumes:
      - ./security/certs:/certs:ro
    restart: unless-stopped

  task-runner-standby:
    build: .
    container_name: hybc-task-runner-standby
    env_file:
      - ./env/node-standby.env
    volumes:
      - ./security/certs:/certs:ro
    restart: unless-stopped
